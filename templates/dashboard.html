<!DOCTYPE html>
<html lang="en">
<head>

  <title>Dashboard - AI Portfolio Hybrid</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <h1>Dashboard</h1>
    <nav>
      <a href="/">Home</a> |
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <main>
    <section class="ai-box">
      <h2>Rewrite Portfolio Section (Agent)</h2>
      <form method="post" action="/ai-rewrite">

        <label>Job Role: <input type="text" name="job_role" required></label><br>
        <label>Keywords: <input type="text" name="keywords"></label><br>
        <label>Project Info: <input type="text" name="project_info"></label><br>
        <button type="submit">Generate Rewrite</button>
      </form>
      {% if rewritten_text %}
        <div class="ai-output">
          <strong>Rewritten Text:</strong>
          <p>{{ rewritten_text }}</p>
        </div>
      {% endif %}
    </section>
